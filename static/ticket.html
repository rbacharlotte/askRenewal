<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f3f4f6" />
  <title>Submit a Ticket | askRenewal</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gray-100 text-gray-800">
  <header class="border-b border-gray-200 bg-white">
    <div class="mx-auto flex max-w-5xl items-center justify-between gap-4 px-5 py-4">
      <a href="./index.html" class="text-xl font-bold text-green-600">askRenewal</a>
      <a href="./docs.html" class="rounded-md border border-gray-300 px-4 py-2 text-sm font-medium text-gray-700 hover:bg-gray-50">Help &amp; contacts</a>
    </div>
  </header>

  <main class="mx-auto max-w-3xl px-5 py-8 md:py-12">
    <div class="mb-7">
      <p class="mb-2 text-sm font-semibold uppercase tracking-wide text-green-700">Internal IT</p>
      <h1 class="text-3xl font-bold text-gray-900 md:text-4xl">Submit a ticket</h1>
      <p class="mt-3 text-gray-600">Describe the issue and Internal IT will follow up using the email address you provide.</p>
    </div>

    <form id="ticket-form" class="space-y-5 rounded-md border border-gray-200 bg-white p-5 shadow-sm md:p-7">
      <div class="grid grid-cols-1 gap-5 sm:grid-cols-2">
        <div>
          <label for="ticket-name" class="mb-2 block text-sm font-medium text-gray-800">Your name</label>
          <input id="ticket-name" name="name" type="text" autocomplete="name" maxlength="120" required class="w-full rounded-md border border-gray-300 px-3 py-2.5 outline-none focus:border-green-600 focus:ring-2 focus:ring-green-100" />
        </div>
        <div>
          <label for="ticket-email" class="mb-2 block text-sm font-medium text-gray-800">Work email</label>
          <input id="ticket-email" name="email" type="email" autocomplete="email" maxlength="254" required class="w-full rounded-md border border-gray-300 px-3 py-2.5 outline-none focus:border-green-600 focus:ring-2 focus:ring-green-100" />
        </div>
      </div>

      <div>
        <label for="ticket-category" class="mb-2 block text-sm font-medium text-gray-800">Issue category</label>
        <select id="ticket-category" name="category" required class="w-full rounded-md border border-gray-300 bg-white px-3 py-2.5 outline-none focus:border-green-600 focus:ring-2 focus:ring-green-100">
          <option value="">Select a category</option>
          <option>Password</option>
          <option>Software</option>
          <option>Hardware</option>
          <option>Email</option>
          <option>Network</option>
          <option>Other</option>
        </select>
      </div>

      <div>
        <label for="ticket-details" class="mb-2 block text-sm font-medium text-gray-800">What’s happening?</label>
        <textarea id="ticket-details" name="details" rows="6" minlength="10" maxlength="5000" required placeholder="Include any error messages and steps you have already tried." class="w-full resize-y rounded-md border border-gray-300 px-3 py-2.5 outline-none placeholder:text-gray-400 focus:border-green-600 focus:ring-2 focus:ring-green-100"></textarea>
      </div>

      <div class="hidden" aria-hidden="true">
        <label for="ticket-website">Leave this field empty</label>
        <input id="ticket-website" name="website" type="text" tabindex="-1" autocomplete="off" />
      </div>

      <div class="flex flex-col gap-4 border-t border-gray-100 pt-5 sm:flex-row sm:items-center sm:justify-between">
        <p id="ticket-status" class="text-sm text-gray-600" role="status" aria-live="polite"></p>
        <button id="ticket-submit" type="submit" class="inline-flex items-center justify-center rounded-md bg-green-600 px-5 py-3 font-semibold text-white shadow-sm hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-green-500 focus:ring-offset-2 disabled:cursor-wait disabled:opacity-60">Send ticket</button>
      </div>
    </form>

    <p class="mt-5 text-sm text-gray-600">For urgent help, email <a class="font-medium text-green-700 underline" href="mailto:achaple@rbacharlotte.com">Angel Chaple</a>.</p>
  </main>

  <script src="/static/js/ticket.js"></script>
</body>
</html>
